

name: Build BeejRakshak Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build BeejRakshak APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Download project source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Configure Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi

          echo "Using: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 5. Install project dependencies
      - name: Install npm dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # 6. Build web application
      - name: Build web application
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      # 7. Sync Capacitor Android
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 8. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # 9. Generate Gradle wrapper if missing
      - name: Generate Gradle wrapper if missing
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/gradlew ] || \
             [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then

            mkdir -p /tmp/gradle-bootstrap
            cd /tmp/gradle-bootstrap

            printf "rootProject.name = 'gradle-bootstrap'\n" > settings.gradle
            printf "tasks.register('dummy')\n" > build.gradle

            gradle wrapper \
              --gradle-version 8.14.3 \
              --distribution-type all

            mkdir -p "$GITHUB_WORKSPACE/android/gradle/wrapper"

            cp gradlew "$GITHUB_WORKSPACE/android/"
            cp gradlew.bat "$GITHUB_WORKSPACE/android/"

            cp gradle/wrapper/gradle-wrapper.jar \
              "$GITHUB_WORKSPACE/android/gradle/wrapper/"

            cp gradle/wrapper/gradle-wrapper.properties \
              "$GITHUB_WORKSPACE/android/gradle/wrapper/"
          fi

          chmod +x "$GITHUB_WORKSPACE/android/gradlew"

      # 10. Build Android APK
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 11. Verify APK
      - name: Verify APK
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      # 12. Upload APK
      - name: Upload BeejRakshak APK
        uses: actions/upload-artifact@v4
        with:
          name: BeejRakshak-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
