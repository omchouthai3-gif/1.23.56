name: Build BeejRakshak Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: beejrakshak-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

          if ! sdkmanager --list_installed | grep -Fq 'platforms;android-36'; then
            sdkmanager 'platforms;android-36'
          fi

          sdkmanager 'platform-tools' 'build-tools;36.0.0'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build React and Vite application
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Check backend configuration
        shell: bash
        run: |
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "::warning::VITE_API_BASE_URL is not configured. The APK will keep offline features, but Android AI inspection, cloud alerts and Gemini TTS will remain unavailable until a backend URL is configured and the APK is rebuilt."
          else
            echo "Android build will connect to: ${VITE_API_BASE_URL}"
          fi
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Generate Gradle wrapper if missing
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p /tmp/gradle-wrapper-bootstrap
            gradle -p /tmp/gradle-wrapper-bootstrap wrapper \\
              --gradle-version 8.14.3 \\
              --distribution-type all
            cp /tmp/gradle-wrapper-bootstrap/gradlew android/gradlew
            cp /tmp/gradle-wrapper-bootstrap/gradlew.bat android/gradlew.bat
            mkdir -p android/gradle/wrapper
            cp /tmp/gradle-wrapper-bootstrap/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/
            cp /tmp/gradle-wrapper-bootstrap/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/
          fi

          chmod +x android/gradlew

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          node --version
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk"
          test -d "$android_sdk/platforms/android-36"
          test -d "$android_sdk/build-tools/36.0.0"
          grep -q 'gradle-8.14.3' android/gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH='android/app/build/outputs/apk/debug/app-debug.apk'

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK was not generated or is empty: $APK_PATH"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BeejRakshak-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo "## BeejRakshak Android build"
            echo ""
            echo "Debug APK compiled and uploaded successfully."
            echo ""
            echo "Artifact: **BeejRakshak-debug-apk**"
          } >> "$GITHUB_STEP_SUMMARY"
